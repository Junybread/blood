<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혈압 다이어리 — 관리자</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="혈압 다이어리">
  <meta name="theme-color" content="#1a1f2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f2e;--paper:#f5f2ed;--card:#fff;--accent:#c0392b;--teal:#1a6b7a;--teal-soft:#d4eaed;--gold:#b8960c;--border:#ddd8d0;--muted:#8a8478;--sys-color:#c0392b;--dia-color:#1a6b7a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
@media print{
  body{background:white;}.no-print{display:none!important;}.print-only{display:block!important;}
  .card{box-shadow:none!important;border:1px solid #ccc!important;}
  header,.tab-bar{display:none!important;}.main-content{margin:0!important;padding:1rem!important;}
  .table-scroll{max-height:none!important;overflow:visible!important;}.td-del{display:none!important;}
  canvas{max-height:220px!important;}
}
.print-only{display:none;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(26,31,46,0.88);backdrop-filter:blur(4px);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem;}
.overlay-card{background:white;border-radius:18px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.setup-header{background:var(--ink);color:white;padding:1.4rem 1.8rem;}
.setup-header h2{font-family:'DM Serif Display',serif;font-size:1.3rem;}
.setup-header p{font-size:.75rem;opacity:.6;margin-top:.2rem;}
.setup-body{padding:1.5rem;}
.field{margin-bottom:.9rem;}
.field label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.field input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:.65rem .8rem;font-family:inherit;font-size:.88rem;color:var(--ink);outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--teal);}
.btn-primary{width:100%;background:var(--ink);color:white;border:none;border-radius:10px;padding:.85rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;}.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.error-box{background:#fdd;border:1px solid #fbb;border-radius:8px;padding:.6rem .8rem;font-size:.8rem;color:#c00;margin-top:.8rem;display:none;}

/* HEADER */
header{background:var(--ink);color:white;padding:0 1.5rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(26,31,46,.3);}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:.8rem 0;}
.logo{display:flex;align-items:baseline;gap:.5rem;}
.logo-title{font-family:'DM Serif Display',serif;font-size:1.4rem;color:white;}
.logo-badge{background:var(--accent);color:white;font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:4px;letter-spacing:.06em;}
.header-right{display:flex;gap:.6rem;align-items:center;}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.85);padding:.4rem .9rem;border-radius:6px;font-size:.8rem;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-ghost:hover{background:rgba(255,255,255,.16);color:white;}
.user-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:white;padding:.3rem .7rem;border-radius:20px;font-size:.78rem;}

/* PAGE */
.page{max-width:1200px;margin:0 auto;padding:1.5rem;}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;}
.summary-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:1rem 1.2rem;text-align:center;}
.summary-val{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:600;line-height:1;}
.summary-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:.3rem;}

/* TABS */
.tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.5rem;}
.tab-btn{background:none;border:none;padding:.7rem 1.2rem;font-family:inherit;font-size:.85rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
.tab-content{display:none;}.tab-content.active{display:block;}

/* CARDS */
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.05);overflow:hidden;margin-bottom:1.2rem;}
.card-header{padding:.9rem 1.3rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
.card-title{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.card-body{padding:1.3rem;}

/* CHIPS / FILTERS */
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}
.chip-btn{background:var(--paper);border:1.5px solid var(--border);border-radius:20px;padding:.35rem .9rem;font-size:.78rem;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .2s;}
.chip-btn.active{background:var(--ink);color:white;border-color:var(--ink);}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.85rem;}
thead th{background:var(--paper);padding:.6rem .8rem;text-align:left;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1;}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:hover{background:var(--paper);}
tbody td{padding:.65rem .8rem;vertical-align:middle;}
.td-mono{font-family:'JetBrains Mono',monospace;font-weight:600;}
.td-sys{color:var(--sys-color);}.td-dia{color:var(--dia-color);}
.td-date{color:var(--muted);font-size:.78rem;}.td-name{font-weight:700;}
.td-note{color:var(--muted);font-style:italic;font-size:.8rem;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.td-del{background:none;border:none;cursor:pointer;color:var(--border);font-size:1rem;padding:.2rem .4rem;border-radius:4px;transition:color .2s;}
.td-del:hover{color:var(--accent);}
.table-scroll{max-height:420px;overflow-y:auto;}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted);}

/* BADGES */
.status-badge{padding:.25rem .7rem;border-radius:20px;font-size:.72rem;font-weight:700;}
.status-normal{background:#d4edda;color:#155724;}.status-elevated{background:#fff3cd;color:#856404;}
.status-stage1{background:#ffe0cc;color:#7d3900;}.status-stage2{background:#fdd;color:#7d0000;}
.status-crisis{background:#cc0000;color:white;}

/* USER MANAGEMENT */
.user-list{display:flex;flex-direction:column;gap:.7rem;}
.user-row{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;background:var(--paper);border-radius:10px;border:1px solid var(--border);}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:white;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;flex-shrink:0;}
.user-info{flex:1;}.user-name{font-weight:700;font-size:.95rem;}.user-meta{font-size:.75rem;color:var(--muted);margin-top:.1rem;}
.user-actions{display:flex;gap:.5rem;}
.btn-sm{background:none;border:1.5px solid var(--border);border-radius:6px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .2s;}
.btn-sm:hover{border-color:var(--ink);color:var(--ink);}.btn-sm.danger:hover{border-color:var(--accent);color:var(--accent);}
.add-user-form{background:var(--teal-soft);border:1.5px solid var(--teal);border-radius:10px;padding:1rem;margin-top:1rem;}
.add-user-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:.6rem;align-items:end;}
.add-user-grid input{border:1.5px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-family:inherit;font-size:.88rem;color:var(--ink);outline:none;}
.add-user-grid input:focus{border-color:var(--teal);}
.btn-add{background:var(--teal);color:white;border:none;border-radius:8px;padding:.6rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-add:hover{opacity:.85;}

/* CHART */
.chart-wrap{position:relative;height:240px;padding:.3rem 0;}

/* PW MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;}
.modal-box{background:white;border-radius:14px;padding:1.5rem;width:300px;box-shadow:0 12px 40px rgba(0,0,0,.2);}
.modal-box h3{font-size:1rem;font-weight:700;margin-bottom:1rem;}
.modal-box input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-family:inherit;font-size:.88rem;outline:none;margin-bottom:.8rem;}
.modal-box input:focus{border-color:var(--teal);}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;}
.btn-cancel{background:var(--paper);border:1px solid var(--border);border-radius:7px;padding:.5rem 1rem;font-size:.82rem;cursor:pointer;font-family:inherit;}
.btn-ok{background:var(--ink);color:white;border:none;border-radius:7px;padding:.5rem 1rem;font-size:.82rem;cursor:pointer;font-family:inherit;font-weight:600;}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--ink);color:white;padding:.8rem 1.2rem;border-radius:10px;font-size:.85rem;font-weight:500;z-index:9999;transform:translateY(20px);opacity:0;transition:all .3s ease;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- SETUP OVERLAY -->
<div class="overlay" id="setupOverlay">
  <div class="overlay-card">
    <div class="setup-header">
      <h2>⚙️ Supabase 연결 설정</h2>
      <p>관리자 페이지 초기 설정</p>
    </div>
    <div class="setup-body">
      <div class="field"><label>Supabase Project URL</label><input type="text" id="sbUrl" placeholder="https://xxxxxxxxxxx.supabase.co"></div>
      <div class="field"><label>Supabase Anon Key</label><input type="text" id="sbKey" placeholder="eyJhbGci..."></div>
      <button class="btn-primary" id="connectBtn" onclick="connectSupabase()">🔗 연결하기</button>
      <div class="error-box" id="setupError"></div>
    </div>
  </div>
</div>

<!-- PRINT HEADER -->
<div class="print-only" style="padding:1rem 1.5rem .5rem;border-bottom:2px solid #333;margin-bottom:1rem;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-family:'DM Serif Display',serif;font-size:1.6rem;">혈압 관리 — 관리자 리포트</div>
      <div style="font-size:.8rem;color:#666;margin-top:.2rem;">출력일: <span id="printDate"></span> · 대상: <span id="printTarget"></span></div>
    </div>
    <div id="printSummary" style="text-align:right;font-size:.82rem;"></div>
  </div>
</div>

<header class="no-print">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-title">❤️ 혈압 다이어리</span>
      <span class="logo-badge">ADMIN</span>
    </div>
    <div class="header-right">
      <span class="user-chip" id="userChip"></span>
      <button class="btn-ghost" onclick="doLogout()">로그아웃</button>
      <button class="btn-ghost" onclick="resetSetup()">⚙️</button>
    </div>
  </div>
</header>

<div class="page">
  <!-- SUMMARY -->
  <div class="summary-grid">
    <div class="summary-card"><div class="summary-val" id="sumUsers">—</div><div class="summary-label">총 사용자</div></div>
    <div class="summary-card"><div class="summary-val" id="sumRecords">—</div><div class="summary-label">총 기록 수</div></div>
    <div class="summary-card"><div class="summary-val td-sys" id="sumAvgSys">—</div><div class="summary-label">전체 평균 수축기</div></div>
    <div class="summary-card"><div class="summary-val td-dia" id="sumAvgDia">—</div><div class="summary-label">전체 평균 이완기</div></div>
  </div>

  <!-- TABS -->
  <div class="tab-bar no-print">
    <button class="tab-btn active" onclick="switchTab('records',this)">📋 전체 기록</button>
    <button class="tab-btn" onclick="switchTab('charts',this)">📊 그래프</button>
    <button class="tab-btn" onclick="switchTab('users',this)">👥 사용자 관리</button>
  </div>

  <!-- TAB: RECORDS -->
  <div class="tab-content active" id="tab-records">
    <div class="card">
      <div class="card-header">
        <span class="card-title">전체 혈압 기록</span>
        <div style="display:flex;gap:.5rem;">
          <button class="btn-ghost no-print" style="padding:.35rem .7rem;font-size:.75rem;" onclick="exportCSV()">📥 CSV</button>
          <button class="btn-ghost no-print" style="padding:.35rem .7rem;font-size:.75rem;" onclick="printRecords()">🖨 인쇄</button>
        </div>
      </div>
      <div class="card-body" style="padding-bottom:.5rem;">
        <div class="chip-row" id="userFilterRow"></div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>이름</th><th>날짜/시간</th><th>수축기</th><th>이완기</th><th>맥박</th><th>상태</th><th>메모</th><th class="no-print"></th></tr>
          </thead>
          <tbody id="recordsTbody"></tbody>
        </table>
        <div class="empty-state" id="emptyState"><p>기록이 없습니다.</p></div>
      </div>
    </div>
  </div>

  <!-- TAB: CHARTS -->
  <div class="tab-content" id="tab-charts">
    <div class="card no-print">
      <div class="card-header">
        <span class="card-title">사용자 선택</span>
        <div class="chip-row" id="chartRangeFilter" style="margin:0;">
          <button class="chip-btn active" onclick="setChartRange(14,this)">14일</button>
          <button class="chip-btn" onclick="setChartRange(30,this)">30일</button>
          <button class="chip-btn" onclick="setChartRange(0,this)">전체</button>
        </div>
      </div>
      <div class="card-body">
        <div class="chip-row" id="chartUserFilter"></div>
      </div>
    </div>
    <div id="chartsContainer"></div>
  </div>

  <!-- TAB: USERS -->
  <div class="tab-content" id="tab-users">
    <div class="card">
      <div class="card-header"><span class="card-title">사용자 목록</span></div>
      <div class="card-body">
        <div class="user-list" id="userList"></div>
        <div class="add-user-form" style="margin-top:1rem;">
          <div style="font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:.7rem;">+ 새 사용자 추가</div>
          <div class="add-user-grid">
            <input type="text" id="newName" placeholder="이름 (한글 가능)">
            <input type="password" id="newPw" placeholder="비밀번호">
            <button class="btn-add" onclick="addUser()">추가</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let sbClient = null;
let allRecords = [], allUsers = [], currentAdmin = null;
let selectedUser = 'all', chartSelectedUser = null, chartRange = 14;
let chartInstances = {};

/* ── INIT ── */
window.addEventListener('load', function() {
  var url = 'https://pwuargbrrdgotyuwdtjh.supabase.co';
  var key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3dWFyZ2JycmRnb3R5dXdkdGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTI1ODYsImV4cCI6MjA5NTM4ODU4Nn0.uGpWa7jspFOYRSS6e9YRusji7e3mnvPQbH9jNEnudVI';
  document.getElementById('setupOverlay').style.display = 'none';
  initSupabase(url, key);
});

/* ── SETUP ── */
async function connectSupabase() {
  var url = document.getElementById('sbUrl').value.trim();
  var key = document.getElementById('sbKey').value.trim();
  if (!url || !key) { showErr('setupError', 'URL과 Key를 입력해주세요.'); return; }
  var btn = document.getElementById('connectBtn');
  btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
  try {
    var c = window.supabase.createClient(url, key);
    var res = await c.from('bp_users').select('id').limit(1);
    if (res.error) throw res.error;
    localStorage.setItem('sb_url', url);
    localStorage.setItem('sb_key', key);
    document.getElementById('setupOverlay').style.display = 'none';
    initSupabase(url, key);
  } catch(e) {
    showErr('setupError', '연결 실패: ' + e.message);
    btn.innerHTML = '🔗 연결하기'; btn.disabled = false;
  }
}

function resetSetup() {
  if (!confirm('연결 설정을 초기화할까요?')) return;
  localStorage.removeItem('sb_url');
  localStorage.removeItem('sb_key');
  location.reload();
}

/* ── SUPABASE INIT ── */
function initSupabase(url, key) {
  sbClient = window.supabase.createClient(url, key);
  var s = localStorage.getItem('bp_admin');
  if (s) {
    currentAdmin = JSON.parse(s);
    showApp();
  } else {
    window.location.href = 'login.html';
  }
}

/* ── LOGOUT ── */
function doLogout() {
  localStorage.removeItem('bp_admin');
  currentAdmin = null; allRecords = []; allUsers = [];
  window.location.href = 'login.html';
}

/* ── SHOW APP ── */
async function showApp() {
  document.getElementById('userChip').textContent = '🛡 ' + currentAdmin.name;
  await Promise.all([loadUsers(), loadRecords()]);
}

/* ── DATA ── */
async function loadUsers() {
  var res = await sbClient.from('bp_users').select('*').order('id');
  if (res.error) { showToast('사용자 로드 실패'); return; }
  allUsers = res.data;
  renderUserManagement();
  buildUserFilters();
}

async function loadRecords() {
  var res = await sbClient.from('blood_pressure')
    .select('*,bp_users(name)').order('recorded_at', {ascending: false});
  if (res.error) { showToast('기록 로드 실패'); return; }
  allRecords = res.data.map(function(r) {
    return {
      id: r.id,
      userName: r.bp_users ? r.bp_users.name : '알 수 없음',
      userId: r.user_id,
      sys: r.sys, dia: r.dia, pulse: r.pulse,
      time: r.recorded_at.slice(0, 16),
      note: r.note || ''
    };
  });
  renderAll();
}

function renderAll() { renderSummary(); renderRecords(); }

/* ── SUMMARY ── */
function renderSummary() {
  document.getElementById('sumUsers').textContent = allUsers.length;
  document.getElementById('sumRecords').textContent = allRecords.length;
  if (allRecords.length) {
    var avg = function(a) { return Math.round(a.reduce(function(x,y){return x+y;},0)/a.length); };
    document.getElementById('sumAvgSys').textContent = avg(allRecords.map(function(r){return r.sys;}));
    document.getElementById('sumAvgDia').textContent = avg(allRecords.map(function(r){return r.dia;}));
  }
}

/* ── FILTERS ── */
function buildUserFilters() {
  var rfr = document.getElementById('userFilterRow');
  rfr.innerHTML = '<button class="chip-btn active" onclick="setUserFilter(\'all\',this)">전체</button>' +
    allUsers.map(function(u) {
      return '<button class="chip-btn" onclick="setUserFilter(' + u.id + ',this)">' + u.name + '</button>';
    }).join('');

  var cfr = document.getElementById('chartUserFilter');
  if (allUsers.length > 0) {
    chartSelectedUser = allUsers[0].id;
    cfr.innerHTML = allUsers.map(function(u, i) {
      return '<button class="chip-btn' + (i===0?' active':'') + '" onclick="setChartUser(' + u.id + ',this)">' + u.name + '</button>';
    }).join('');
  }
}

function setUserFilter(uid, btn) {
  selectedUser = uid;
  document.querySelectorAll('#userFilterRow .chip-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderRecords();
}

/* ── RECORDS ── */
function renderRecords() {
  var tbody = document.getElementById('recordsTbody');
  var empty = document.getElementById('emptyState');
  var filtered = selectedUser === 'all' ? allRecords : allRecords.filter(function(r){return r.userId === selectedUser;});
  if (!filtered.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(function(r) {
    var c = classify(r.sys, r.dia);
    var dt = new Date(r.time);
    var dateStr = dt.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit',weekday:'short'});
    var timeStr = dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    return '<tr>' +
      '<td class="td-name">' + r.userName + '</td>' +
      '<td class="td-date">' + dateStr + ' ' + timeStr + '</td>' +
      '<td class="td-mono td-sys">' + r.sys + '</td>' +
      '<td class="td-mono td-dia">' + r.dia + '</td>' +
      '<td class="td-mono">' + (r.pulse||'—') + '</td>' +
      '<td><span class="status-badge ' + c.cls + '">' + c.label + '</span></td>' +
      '<td class="td-note" title="' + r.note + '">' + r.note + '</td>' +
      '<td class="no-print"><button class="td-del" onclick="deleteRecord(' + r.id + ')">✕</button></td>' +
      '</tr>';
  }).join('');
}

async function deleteRecord(id) {
  if (!confirm('이 기록을 삭제하시겠습니까?')) return;
  var res = await sbClient.from('blood_pressure').delete().eq('id', id);
  if (res.error) { showToast('❌ 삭제 실패'); return; }
  allRecords = allRecords.filter(function(r){return r.id !== id;});
  renderAll(); showToast('🗑 삭제되었습니다.');
}

/* ── CHARTS ── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'charts') renderCharts();
}

function setChartUser(uid, btn) {
  chartSelectedUser = uid;
  document.querySelectorAll('#chartUserFilter .chip-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active'); renderCharts();
}

function setChartRange(days, btn) {
  chartRange = days;
  document.querySelectorAll('#chartRangeFilter .chip-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active'); renderCharts();
}

function renderCharts() {
  var container = document.getElementById('chartsContainer');
  var usersToShow = chartSelectedUser
    ? allUsers.filter(function(u){return u.id === chartSelectedUser;})
    : allUsers;
  container.innerHTML = '';
  Object.values(chartInstances).forEach(function(c){c.destroy();});
  chartInstances = {};

  usersToShow.forEach(function(user) {
    var recs = allRecords.filter(function(r){return r.userId === user.id;})
      .sort(function(a,b){return new Date(a.time)-new Date(b.time);});
    if (chartRange > 0) {
      var cut = new Date(); cut.setDate(cut.getDate() - chartRange);
      recs = recs.filter(function(r){return new Date(r.time) >= cut;});
    }
    var div = document.createElement('div'); div.className = 'card';
    div.innerHTML = '<div class="card-header"><span class="card-title">' + user.name + ' 혈압 추이</span><span style="font-size:.75rem;color:var(--muted);">' + recs.length + '건</span></div><div class="card-body"><div class="chart-wrap"><canvas id="chart-' + user.id + '"></canvas></div></div>';
    container.appendChild(div);
    var labels = recs.map(function(r){var dt=new Date(r.time);return dt.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});});
    var ctx = document.getElementById('chart-' + user.id).getContext('2d');
    chartInstances[user.id] = new Chart(ctx, {
      type:'line',
      data:{labels:labels,datasets:[
        {label:'수축기',data:recs.map(function(r){return r.sys;}),borderColor:'#c0392b',backgroundColor:'rgba(192,57,43,0.08)',borderWidth:2,pointRadius:3,tension:0.3,fill:true},
        {label:'이완기',data:recs.map(function(r){return r.dia;}),borderColor:'#1a6b7a',backgroundColor:'rgba(26,107,122,0.05)',borderWidth:2,pointRadius:3,tension:0.3,fill:true}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:12,boxWidth:12}},tooltip:{backgroundColor:'#1a1f2e',padding:10}},
        scales:{x:{ticks:{font:{size:10},color:'#8a8478',maxTicksLimit:10},grid:{color:'rgba(0,0,0,0.03)'}},
          y:{suggestedMin:60,suggestedMax:180,ticks:{font:{size:10},color:'#8a8478'},grid:{color:'rgba(0,0,0,0.03)'}}}}
    });
  });
}

/* ── USER MANAGEMENT ── */
function renderUserManagement() {
  var list = document.getElementById('userList');
  if (!allUsers.length) { list.innerHTML = '<div class="empty-state"><p>사용자가 없습니다.</p></div>'; return; }
  list.innerHTML = allUsers.map(function(u) {
    var cnt = allRecords.filter(function(r){return r.userId===u.id;}).length;
    var adminBadge = u.is_admin ? '<span style="font-size:.65rem;background:#e8d5d3;color:#c0392b;padding:.1rem .4rem;border-radius:4px;font-weight:700;margin-left:.4rem;">관리자</span>' : '';
    var deleteBtn = u.is_admin ? '' : '<button class="btn-sm danger" onclick="deleteUser(' + u.id + ',\'' + u.name + '\')">삭제</button>';
    return '<div class="user-row">' +
      '<div class="user-avatar">' + u.name.slice(0,1) + '</div>' +
      '<div class="user-info">' +
        '<div class="user-name">' + u.name + adminBadge + '</div>' +
        '<div class="user-meta">기록 ' + cnt + '건</div>' +
      '</div>' +
      '<div class="user-actions">' +
        '<button class="btn-sm" onclick="changePw(' + u.id + ',\'' + u.name + '\')">비밀번호 변경</button>' +
        deleteBtn +
      '</div></div>';
  }).join('');
}

async function addUser() {
  var name = document.getElementById('newName').value.trim();
  var pw = document.getElementById('newPw').value;
  if (!name || !pw) { showToast('이름과 비밀번호를 입력해주세요.'); return; }
  var res = await sbClient.from('bp_users').insert({name:name, password:pw, is_admin:false}).select().single();
  if (res.error) { showToast('❌ 추가 실패: ' + (res.error.message.includes('unique') ? '이미 존재하는 이름입니다.' : res.error.message)); return; }
  allUsers.push(res.data);
  document.getElementById('newName').value = '';
  document.getElementById('newPw').value = '';
  renderUserManagement(); buildUserFilters(); showToast('✅ ' + name + ' 추가 완료!');
}

async function deleteUser(id, name) {
  if (!confirm("'" + name + "' 사용자를 삭제하시겠습니까?\n해당 사용자의 모든 혈압 기록도 삭제됩니다.")) return;
  await sbClient.from('blood_pressure').delete().eq('user_id', id);
  var res = await sbClient.from('bp_users').delete().eq('id', id);
  if (res.error) { showToast('❌ 삭제 실패'); return; }
  allUsers = allUsers.filter(function(u){return u.id !== id;});
  allRecords = allRecords.filter(function(r){return r.userId !== id;});
  renderUserManagement(); buildUserFilters(); renderAll(); showToast('🗑 사용자 삭제 완료');
}

function changePw(id, name) {
  var bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal-box"><h3>🔑 비밀번호 변경 — ' + name + '</h3><input type="password" id="newPwInput" placeholder="새 비밀번호"><div class="modal-actions"><button class="btn-cancel" onclick="this.closest(\'.modal-bg\').remove()">취소</button><button class="btn-ok" id="savePwBtn">변경</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector('input').focus();
  bg.querySelector('#savePwBtn').addEventListener('click', async function() {
    var pw = document.getElementById('newPwInput').value;
    if (!pw) { showToast('비밀번호를 입력해주세요.'); return; }
    this.textContent = '저장 중...'; this.disabled = true;
    var res = await sbClient.from('bp_users').update({password:pw}).eq('id', id);
    if (res.error) { showToast('❌ 변경 실패'); return; }
    bg.remove(); showToast('✅ 비밀번호가 변경되었습니다.');
  });
}

/* ── CLASSIFY ── */
function classify(s, d) {
  if (s>=180||d>=120) return {key:'crisis',   label:'고혈압 위기', cls:'status-crisis'};
  if (s>=140||d>=90)  return {key:'stage2',   label:'고혈압 2기',  cls:'status-stage2'};
  if (s>=130||d>=80)  return {key:'stage1',   label:'고혈압 1기',  cls:'status-stage1'};
  if (s>=120&&d<80)   return {key:'elevated', label:'주의',        cls:'status-elevated'};
  return {key:'normal', label:'정상', cls:'status-normal'};
}

/* ── EXPORT / PRINT ── */
function exportCSV() {
  var filtered = selectedUser === 'all' ? allRecords : allRecords.filter(function(r){return r.userId===selectedUser;});
  if (!filtered.length) { showToast('내보낼 기록이 없습니다.'); return; }
  var rows = [['이름','날짜','시간','수축기(mmHg)','이완기(mmHg)','맥박(bpm)','상태','메모']];
  filtered.slice().sort(function(a,b){return new Date(a.time)-new Date(b.time);}).forEach(function(r) {
    var dt = new Date(r.time);
    rows.push([r.userName, dt.toLocaleDateString('ko-KR'), dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}), r.sys, r.dia, r.pulse||'', classify(r.sys,r.dia).label, r.note]);
  });
  var csv = '\uFEFF' + rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a = document.createElement('a');
  var uname = selectedUser === 'all' ? '전체' : (allUsers.find(function(u){return u.id===selectedUser;})||{name:''}).name;
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  a.download = '혈압기록_' + uname + '_' + new Date().toLocaleDateString('ko-KR').replace(/\.\s*/g,'-').replace(/-$/,'') + '.csv';
  a.click(); showToast('📥 CSV 저장 완료!');
}

function printRecords() {
  var uname = selectedUser === 'all' ? '전체 사용자' : (allUsers.find(function(u){return u.id===selectedUser;})||{name:''}).name;
  document.getElementById('printDate').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('printTarget').textContent = uname;
  var filtered = selectedUser === 'all' ? allRecords : allRecords.filter(function(r){return r.userId===selectedUser;});
  document.getElementById('printSummary').innerHTML = '총 기록: <strong>' + filtered.length + '건</strong>';
  window.print();
}

/* ── UTILS ── */
function showErr(id, m) { var e=document.getElementById(id); e.textContent=m; e.style.display='block'; }
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 2800);
}
</script>
