<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혈압 다이어리 — 로그인</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1f2e; --paper:#f5f2ed; --card:#fff;
  --teal:#1a6b7a; --teal-soft:#d4eaed;
  --border:#ddd8d0; --muted:#8a8478;
  --accent:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  font-family:'Noto Sans KR',sans-serif;
  background:var(--ink);
  min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:1.5rem; position:relative; overflow:hidden;
}
body::before {
  content:''; position:absolute;
  width:600px; height:600px; border-radius:50%;
  background:radial-gradient(circle,rgba(192,57,43,.12) 0%,transparent 70%);
  top:-200px; right:-200px; pointer-events:none;
}
body::after {
  content:''; position:absolute;
  width:400px; height:400px; border-radius:50%;
  background:radial-gradient(circle,rgba(26,107,122,.1) 0%,transparent 70%);
  bottom:-150px; left:-100px; pointer-events:none;
}

/* SETUP */
.setup-wrap {
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px; width:100%; max-width:460px;
  padding:2rem; margin-bottom:1rem; display:none;
}
.setup-wrap.show { display:block; }
.setup-label { font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:.4rem; display:block; }
.setup-input { width:100%; background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.12); border-radius:8px; padding:.65rem .9rem; font-family:'JetBrains Mono',monospace; font-size:.8rem; color:rgba(255,255,255,.85); outline:none; transition:border-color .2s; margin-bottom:.8rem; }
.setup-input::placeholder { color:rgba(255,255,255,.25); }
.setup-input:focus { border-color:var(--teal); }
.btn-setup { width:100%; background:var(--teal); color:white; border:none; border-radius:8px; padding:.75rem; font-size:.88rem; font-weight:700; cursor:pointer; font-family:inherit; transition:opacity .2s; }
.btn-setup:hover { opacity:.85; } .btn-setup:disabled { opacity:.5; cursor:not-allowed; }
.setup-error { background:rgba(192,57,43,.2); border:1px solid rgba(192,57,43,.4); border-radius:8px; padding:.55rem .8rem; font-size:.78rem; color:#f5a09a; margin-top:.7rem; display:none; }

/* CARD */
.login-card {
  background:var(--card); border-radius:24px;
  width:100%; max-width:400px; overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.5);
  position:relative; z-index:1;
  transition:all .3s ease;
}

/* MODE TOGGLE */
.mode-toggle {
  display:flex; background:rgba(255,255,255,.08);
  border-radius:0; overflow:hidden;
}
.mode-btn {
  flex:1; padding:.85rem; font-size:.82rem; font-weight:700;
  font-family:inherit; border:none; cursor:pointer;
  transition:all .25s; letter-spacing:.03em;
  background:transparent; color:rgba(255,255,255,.45);
}
.mode-btn.active {
  background:rgba(255,255,255,.12); color:white;
}
.mode-btn.admin-btn.active {
  background:rgba(192,57,43,.4); color:white;
}

/* CARD TOP */
.card-top {
  background:linear-gradient(135deg,#1a1f2e 0%,#2d3548 100%);
  padding:2rem 2rem 1.6rem; text-align:center; position:relative;
  transition:background .3s;
}
.card-top.admin-mode {
  background:linear-gradient(135deg,#2d1a1a 0%,#4a1f1f 100%);
}
.icon-wrap { font-size:2.8rem; display:block; margin-bottom:.6rem; }
.card-title { font-family:'DM Serif Display',serif; font-size:1.7rem; color:white; letter-spacing:-.02em; transition:all .3s; }
.card-sub { font-size:.75rem; color:rgba(255,255,255,.4); margin-top:.25rem; letter-spacing:.04em; transition:all .3s; }

.ecg-line { display:flex; align-items:center; justify-content:center; margin-top:1rem; opacity:.2; }
.ecg-line svg { width:180px; height:26px; }

/* CARD BODY */
.card-body { padding:1.8rem 2rem; }

.field { margin-bottom:1.1rem; }
.field-label { display:block; font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:.4rem; }
.field-input { width:100%; border:2px solid var(--border); border-radius:10px; padding:.78rem 1rem; font-family:'Noto Sans KR',sans-serif; font-size:.95rem; color:var(--ink); outline:none; transition:border-color .2s, box-shadow .2s; background:var(--paper); }
.field-input:focus { border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); background:white; }
.field-input.admin-focus:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(192,57,43,.12); }
.field-input::placeholder { color:#bbb; }

.btn-login {
  width:100%; background:var(--ink); color:white; border:none;
  border-radius:12px; padding:.92rem; font-size:.98rem; font-weight:700;
  cursor:pointer; font-family:inherit; letter-spacing:.02em;
  box-shadow:0 4px 16px rgba(26,31,46,.25);
  margin-top:.3rem; transition:transform .15s, opacity .2s, box-shadow .2s, background .3s;
}
.btn-login:hover { opacity:.88; transform:translateY(-1px); box-shadow:0 6px 20px rgba(26,31,46,.3); }
.btn-login:active { transform:translateY(0); }
.btn-login:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-login.admin-btn { background:var(--accent); box-shadow:0 4px 16px rgba(192,57,43,.3); }
.btn-login.admin-btn:hover { box-shadow:0 6px 20px rgba(192,57,43,.4); }

.login-error { background:#fff0ef; border:1.5px solid #ffccc9; border-radius:8px; padding:.65rem .9rem; font-size:.82rem; color:var(--accent); margin-top:.9rem; display:none; text-align:center; font-weight:500; }

/* CARD FOOTER */
.card-footer { padding:.9rem 2rem 1.4rem; text-align:center; border-top:1px solid var(--border); }
.footer-link { font-size:.75rem; color:var(--muted); cursor:pointer; background:none; border:none; font-family:inherit; text-decoration:underline; text-underline-offset:3px; }
.footer-link:hover { color:var(--ink); }

.bottom-note { color:rgba(255,255,255,.22); font-size:.72rem; margin-top:1.5rem; text-align:center; z-index:1; position:relative; }

/* 연결 상태 */
.conn-badge { position:absolute; top:1rem; right:1rem; font-size:.65rem; padding:.2rem .6rem; border-radius:20px; font-weight:700; letter-spacing:.04em; }
.conn-badge.ok { background:rgba(39,174,96,.2); color:#7ecb9a; border:1px solid rgba(39,174,96,.3); }
.conn-badge.fail { background:rgba(192,57,43,.2); color:#f5a09a; border:1px solid rgba(192,57,43,.3); }
.conn-badge.loading { background:rgba(255,255,255,.1); color:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.15); }

/* 관리자 힌트 뱃지 */
.admin-hint {
  display:none; margin-bottom:1rem;
  background:rgba(192,57,43,.08); border:1.5px solid rgba(192,57,43,.2);
  border-radius:8px; padding:.6rem .9rem;
  font-size:.78rem; color:var(--accent); text-align:center;
}
.admin-hint.show { display:block; }

.spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- SETUP 패널 -->
<div class="setup-wrap" id="setupWrap">
  <div style="color:rgba(255,255,255,.7);font-size:.85rem;font-weight:700;margin-bottom:1rem;">⚙️ Supabase 연결 설정</div>
  <label class="setup-label">Project URL</label>
  <input type="text" class="setup-input" id="sbUrl" placeholder="https://xxxxxxxxxxx.supabase.co">
  <label class="setup-label">Anon Key</label>
  <input type="text" class="setup-input" id="sbKey" placeholder="eyJhbGci...">
  <button class="btn-setup" id="connectBtn" onclick="connectSupabase()">🔗 연결하기</button>
  <div class="setup-error" id="setupError"></div>
</div>

<!-- LOGIN CARD -->
<div class="login-card" id="loginCard">

  <!-- 모드 전환 탭 -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="userModeBtn" onclick="setMode('user')">👤 일반 로그인</button>
    <button class="mode-btn admin-btn" id="adminModeBtn" onclick="setMode('admin')">🛡 관리자</button>
  </div>

  <!-- 카드 상단 -->
  <div class="card-top" id="cardTop">
    <span class="conn-badge loading" id="connBadge">연결 중...</span>
    <span class="icon-wrap" id="cardIcon">❤️</span>
    <div class="card-title" id="cardTitle">혈압 다이어리</div>
    <div class="card-sub" id="cardSub">이름과 비밀번호를 입력해주세요</div>
    <div class="ecg-line">
      <svg viewBox="0 0 180 26" fill="none" stroke="white" stroke-width="1.5">
        <polyline points="0,13 28,13 36,4 46,22 54,1 64,25 74,13 110,13 118,7 128,19 136,13 180,13"/>
      </svg>
    </div>
  </div>

  <!-- 카드 바디 -->
  <div class="card-body">
    <div class="admin-hint" id="adminHint">🛡 관리자 계정으로 로그인하세요</div>
    <div class="field">
      <label class="field-label">이름</label>
      <input type="text" class="field-input" id="loginName" placeholder="홍길동" autocomplete="username">
    </div>
    <div class="field">
      <label class="field-label">비밀번호</label>
      <input type="password" class="field-input" id="loginPw" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div class="card-footer">
    <button class="footer-link" onclick="toggleSetup()">연결 설정 변경</button>
  </div>
</div>

<div class="bottom-note">가족 건강 관리 · 데이터는 안전하게 저장됩니다</div>

<script>
var sbClient = null;
var currentMode = 'user'; // 'user' or 'admin'

/* ── INIT ── */
window.addEventListener('load', function() {
  var url = 'https://pwuargbrrdgotyuwdtjh.supabase.co';
  var key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3dWFyZ2JycmRnb3R5dXdkdGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTI1ODYsImV4cCI6MjA5NTM4ODU4Nn0.uGpWa7jspFOYRSS6e9YRusji7e3mnvPQbH9jNEnudVI';
  initSupabase(url, key);
  document.getElementById('loginName').focus();
});

/* ── SUPABASE ── */
async function connectSupabase() {
  var url = document.getElementById('sbUrl').value.trim();
  var key = document.getElementById('sbKey').value.trim();
  if (!url || !key) { showSetupErr('URL과 Key를 모두 입력해주세요.'); return; }
  var btn = document.getElementById('connectBtn');
  btn.innerHTML = '<span class="spinner"></span> 연결 중...'; btn.disabled = true;
  try {
    var c = window.supabase.createClient(url, key);
    var res = await c.from('bp_users').select('id').limit(1);
    if (res.error) throw res.error;
    localStorage.setItem('sb_url', url);
    localStorage.setItem('sb_key', key);
    document.getElementById('setupWrap').classList.remove('show');
    initSupabase(url, key);
  } catch(e) {
    showSetupErr('연결 실패: ' + (e.message || '설정을 확인해주세요.'));
    btn.innerHTML = '🔗 연결하기'; btn.disabled = false;
  }
}

function initSupabase(url, key) {
  setConnBadge('loading', '연결 중...');
  sbClient = window.supabase.createClient(url, key);
  setConnBadge('ok', '연결됨');
}

/* ── MODE SWITCH ── */
function setMode(mode) {
  currentMode = mode;
  var isAdmin = mode === 'admin';

  // 탭 스타일
  document.getElementById('userModeBtn').classList.toggle('active', !isAdmin);
  document.getElementById('adminModeBtn').classList.toggle('active', isAdmin);

  // 카드 상단
  var cardTop = document.getElementById('cardTop');
  var icon = document.getElementById('cardIcon');
  var title = document.getElementById('cardTitle');
  var sub = document.getElementById('cardSub');
  var loginBtn = document.getElementById('loginBtn');
  var adminHint = document.getElementById('adminHint');

  if (isAdmin) {
    cardTop.classList.add('admin-mode');
    icon.textContent = '🛡';
    title.textContent = '관리자 로그인';
    sub.textContent = '관리자 계정으로 접속합니다';
    loginBtn.classList.add('admin-btn');
    loginBtn.textContent = '관리자로 로그인';
    adminHint.classList.add('show');
    document.querySelectorAll('.field-input').forEach(function(el){ el.classList.add('admin-focus'); });
  } else {
    cardTop.classList.remove('admin-mode');
    icon.textContent = '❤️';
    title.textContent = '혈압 다이어리';
    sub.textContent = '이름과 비밀번호를 입력해주세요';
    loginBtn.classList.remove('admin-btn');
    loginBtn.textContent = '로그인';
    adminHint.classList.remove('show');
    document.querySelectorAll('.field-input').forEach(function(el){ el.classList.remove('admin-focus'); });
  }

  // 입력창 초기화
  document.getElementById('loginName').value = '';
  document.getElementById('loginPw').value = '';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('loginName').focus();
}

/* ── LOGIN ── */
async function doLogin() {
  if (!sbClient) { showLoginErr('먼저 Supabase에 연결해주세요.'); return; }
  var name = document.getElementById('loginName').value.trim();
  var pw   = document.getElementById('loginPw').value;
  if (!name || !pw) { showLoginErr('이름과 비밀번호를 입력해주세요.'); return; }

  var btn = document.getElementById('loginBtn');
  var origText = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> 확인 중...'; btn.disabled = true;
  document.getElementById('loginError').style.display = 'none';

  try {
    // 관리자 모드면 is_admin 조건 추가
    var query = sbClient.from('bp_users').select('*').eq('name', name).eq('password', pw);
    if (currentMode === 'admin') {
      query = query.eq('is_admin', true);
    }
    var res = await query.single();

    if (res.error || !res.data) {
      if (currentMode === 'admin') {
        throw new Error('관리자 계정이 아니거나 정보가 올바르지 않습니다.');
      } else {
        throw new Error('이름 또는 비밀번호가 올바르지 않습니다.');
      }
    }

    var user = res.data;
    sessionStorage.setItem('bp_user', JSON.stringify(user));

    // 관리자면 admin.html, 일반이면 tracker
    if (user.is_admin) {
      sessionStorage.setItem('bp_admin', JSON.stringify(user));
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'blood-pressure-tracker.html';
    }

  } catch(e) {
    showLoginErr(e.message);
    btn.innerHTML = origText; btn.disabled = false;
  }
}

/* ── UTILS ── */
function toggleSetup() {
  document.getElementById('setupWrap').classList.toggle('show');
}
function setConnBadge(type, text) {
  var b = document.getElementById('connBadge');
  b.className = 'conn-badge ' + type;
  b.textContent = text;
}
function showSetupErr(m) { var e=document.getElementById('setupError'); e.textContent=m; e.style.display='block'; }
function showLoginErr(m) { var e=document.getElementById('loginError'); e.textContent='⚠️ '+m; e.style.display='block'; }

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
